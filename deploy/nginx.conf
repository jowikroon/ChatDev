map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Public, through Traefik: basic auth.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    auth_basic "ChatDev";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include /etc/nginx/chatdev-locations.conf;
}

# Only for the Cloudflare tunnel (optional): there the portal-gate Worker does
# the auth. Traefik never routes to this port, it is only reachable on the
# docker networks the web container joins.
server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    include /etc/nginx/chatdev-locations.conf;
}
