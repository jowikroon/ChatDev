# ChatDev 2.0 for Hostinger Docker Manager (or any Docker host that can only
# pull images, not build them). Uses public images only and fetches the code
# from Git when the containers start; restarting the project pulls the latest
# commit of CHATDEV_REF. Requires Traefik with a `websecure` entrypoint and a
# `letsencrypt` cert resolver. Settings: see deploy/README.md.
name: chatdev

services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    environment:
      CHATDEV_REPO: ${CHATDEV_REPO:-https://github.com/jowikroon/ChatDev.git}
      CHATDEV_REF: ${CHATDEV_REF:-main}
      BASE_URL: ${BASE_URL:-https://api.openai.com/v1}
      API_KEY: ${API_KEY:-}
      SERPER_DEV_API_KEY: ${SERPER_DEV_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      CORS_ALLOW_ORIGINS: https://${CHATDEV_HOST:-chatdev.localhost}
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -ec
      - |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends libcairo2-dev pkg-config >/dev/null
        if [ -d /srv/app/.git ]; then
          git -C /srv/app fetch --depth 1 origin "$$CHATDEV_REF"
          git -C /srv/app reset --hard FETCH_HEAD
        else
          git clone --depth 1 --branch "$$CHATDEV_REF" "$$CHATDEV_REPO" /srv/app
        fi
        cd /srv/app
        uv sync --frozen
        exec uv run --frozen python server_main.py --host 0.0.0.0 --port 6400
    volumes:
      # Code checkout plus the untracked WareHouse/, data/ and logs/ dirs
      - app:/srv/app
      - venv:/venv
      - uv-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    restart: unless-stopped

  web-build:
    image: node:24-alpine
    environment:
      CHATDEV_REPO: ${CHATDEV_REPO:-https://github.com/jowikroon/ChatDev.git}
      CHATDEV_REF: ${CHATDEV_REF:-main}
    command:
      - sh
      - -ec
      - |
        apk add --no-cache git >/dev/null
        rm -rf /tmp/src
        git clone --depth 1 --branch "$$CHATDEV_REF" "$$CHATDEV_REPO" /tmp/src
        cd /tmp/src/frontend
        npm ci --no-audit --no-fund
        VITE_API_BASE_URL= npm run build
        rm -rf /out/html
        cp -r dist /out/html
        cp ../deploy/nginx.conf /out/default.conf
        cp ../deploy/nginx-locations.conf /out/chatdev-locations.conf
        cp ../deploy/40-basic-auth.sh /out/40-basic-auth.sh
    volumes:
      - webroot:/out
    restart: "no"

  web:
    image: nginx:1.29-alpine
    environment:
      CHATDEV_USER: ${CHATDEV_USER:-admin}
      CHATDEV_PASSWORD: ${CHATDEV_PASSWORD:?set CHATDEV_PASSWORD}
    command:
      - sh
      - -ec
      - |
        cp /out/default.conf /etc/nginx/conf.d/default.conf
        cp /out/chatdev-locations.conf /etc/nginx/chatdev-locations.conf
        rm -rf /usr/share/nginx/html
        ln -s /out/html /usr/share/nginx/html
        sh /out/40-basic-auth.sh
        exec nginx -g 'daemon off;'
    volumes:
      - webroot:/out:ro
    networks:
      - default
      # Shared with the Cloudflare tunnel container, which reaches web:8080
      # (no basic auth; the portal-gate Worker authenticates in front of it).
      - tunnel
    depends_on:
      web-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.chatdev.rule=Host(`${CHATDEV_HOST:-chatdev.localhost}`)
      - traefik.http.routers.chatdev.entrypoints=websecure
      - traefik.http.routers.chatdev.tls.certresolver=letsencrypt
      - traefik.http.routers.chatdev-alt.rule=Host(`${CHATDEV_ALT_HOST:-chatdev-alt.localhost}`)
      - traefik.http.routers.chatdev-alt.entrypoints=websecure
      - traefik.http.routers.chatdev-alt.tls.certresolver=letsencrypt
      - traefik.http.services.chatdev.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  tunnel:
    external: true
    name: ${CHATDEV_TUNNEL_NETWORK:-lab-reverse_default}

volumes:
  app:
  venv:
  uv-cache:
  webroot:
